services:
  db:
    image: postgis/postgis:16-3.4
    container_name: thermogis_db
    environment:
      POSTGRES_USER: fireuser
      POSTGRES_PASSWORD: firepass
      POSTGRES_DB: firedb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fireuser -d firedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: thermogis_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fireuser:firepass@db:5432/firedb
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

volumes:
  pgdata: